<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Audit — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-container"></div>

    <main class="flex-1 overflow-y-auto p-5 md:p-7">
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Log Audit Sistem</h2>
            <p class="text-xs text-slate-400 mt-0.5">50 entri terbaru</p>
          </div>
          <div class="flex-1"></div>
          <!-- Filter by action -->
          <select id="filterAction" class="hidden sm:block border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <option value="">Semua aksi</option>
          </select>
          <button id="auditBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Muat ulang
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100 dark:border-slate-800">
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-5 py-3">Waktu</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Aksi</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">User</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-5 py-3">Detail</th>
              </tr>
            </thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>

        <div class="px-5 py-3 border-t border-slate-100 dark:border-slate-800">
          <p class="text-xs text-slate-400" id="auditCount">—</p>
        </div>
      </div>
    </main>

    <footer class="px-7 py-4 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>STT Engine · FastAPI + Faster-Whisper</span>
      <span id="footUser"></span>
    </footer>
  </div>
</div>

<script src="assets/page-transition.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');

Layout.init({ page: 'audit', title: 'Log Audit' });
document.getElementById('footUser').textContent = Auth.user;

function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const ACTION_COLORS = {
  login:      'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
  logout:     'bg-slate-500/10 text-slate-400 border-slate-500/20',
  register:   'bg-blue-500/10 text-blue-400 border-blue-500/20',
  transcribe: 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20',
  delete:     'bg-rose-500/10 text-rose-400 border-rose-500/20',
  update:     'bg-amber-500/10 text-amber-400 border-amber-500/20',
  model:      'bg-violet-500/10 text-violet-400 border-violet-500/20',
};
function actionColor(action) {
  const key = Object.keys(ACTION_COLORS).find(k => (action || '').toLowerCase().includes(k));
  return key ? ACTION_COLORS[key] : 'bg-slate-500/10 text-slate-400 border-slate-500/20';
}

let allLogs = [];

function renderLogs(rows) {
  const body = document.getElementById('auditBody');
  document.getElementById('auditCount').textContent = rows.length + ' entri ditampilkan';
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="4" class="px-5 py-12 text-center text-slate-400 dark:text-slate-500">
      <div class="flex flex-col items-center gap-2">
        <svg class="w-10 h-10 opacity-30" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        <p class="text-sm font-medium">Belum ada log audit</p>
      </div>
    </td></tr>`;
    return;
  }
  body.innerHTML = rows.map(l => `
    <tr class="border-t border-slate-100 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
      <td class="px-5 py-3.5 text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${escHtml(l.at || l.created_at || '')}</td>
      <td class="px-3 py-3.5">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold border ${actionColor(l.action)}">${escHtml(l.action || '—')}</span>
      </td>
      <td class="px-3 py-3.5 text-xs font-medium text-slate-700 dark:text-slate-300">${escHtml(l.username || l.user || '—')}</td>
      <td class="px-5 py-3.5 text-xs text-slate-500 dark:text-slate-400 max-w-[320px]"><p class="truncate" title="${escHtml(l.detail || '')}">${escHtml(l.detail || '—')}</p></td>
    </tr>
  `).join('');
}

async function loadAudit() {
  document.getElementById('auditBody').innerHTML = `<tr><td colspan="4" class="px-5 py-8 text-center text-slate-400 text-xs">
    <div class="flex items-center justify-center gap-2"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Memuat log...</div>
  </td></tr>`;
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/audit/log?limit=50', { headers: Auth.headers() });
    const j = await r.json();
    allLogs = j.data || [];
    // Populate filter
    const actions = [...new Set(allLogs.map(l => l.action).filter(Boolean))];
    const sel = document.getElementById('filterAction');
    sel.innerHTML = '<option value="">Semua aksi</option>' + actions.map(a => `<option value="${escHtml(a)}">${escHtml(a)}</option>`).join('');
    renderLogs(allLogs);
  } catch (e) {
    document.getElementById('auditBody').innerHTML = `<tr><td colspan="4" class="px-5 py-8 text-center text-rose-400 text-xs">Gagal memuat: ${escHtml(e.message)}</td></tr>`;
  }
}

document.getElementById('auditBtn').onclick = loadAudit;
document.getElementById('filterAction').addEventListener('change', e => {
  const val = e.target.value;
  renderLogs(val ? allLogs.filter(l => l.action === val) : allLogs);
});

loadAudit();
</script>
</body>
</html>
