<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riwayat Pembayaran — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-container"></div>

    <main class="flex-1 overflow-y-auto p-5 md:p-7 space-y-5">

      <!-- Summary cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Total Dibayar</p>
          <p class="text-2xl font-extrabold text-slate-900 dark:text-white" id="sumTotal">—</p>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Transaksi Sukses</p>
          <p class="text-2xl font-extrabold text-emerald-500" id="sumSuccess">—</p>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Paket Saat Ini</p>
          <p class="text-2xl font-extrabold text-indigo-500" id="sumPlan">—</p>
        </div>
      </div>

      <!-- Payment list -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Semua Transaksi</h2>
          <button id="refreshBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh
          </button>
        </div>
        <div id="paymentsList" class="divide-y divide-slate-100 dark:divide-slate-800"></div>
      </div>

    </main>

    <footer class="px-7 py-4 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>STT Engine · FastAPI + Faster-Whisper</span>
      <span id="footUser"></span>
    </footer>
  </div>
</div>

<script src="assets/page-transition.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');

Layout.init({ page: 'billing', title: 'Riwayat Pembayaran', subtitle: 'Semua transaksi langganan Anda', health: false });
document.getElementById('footUser').textContent = Auth.user;

function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatRp(n) { return 'Rp ' + (n || 0).toLocaleString('id-ID'); }

const STATUS = {
  success: { label: 'Berhasil', cls: 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20' },
  pending: { label: 'Menunggu', cls: 'bg-amber-500/10 text-amber-500 border-amber-500/20' },
  failed:  { label: 'Gagal',    cls: 'bg-rose-500/10 text-rose-500 border-rose-500/20' },
};

async function loadPayments() {
  const list = document.getElementById('paymentsList');
  list.innerHTML = `<div class="flex items-center justify-center gap-2 py-10 text-slate-400 text-sm">
    <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
    Memuat riwayat pembayaran...
  </div>`;
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/billing', { headers: Auth.headers() });
    if (!r.ok) throw new Error('Gagal memuat riwayat pembayaran');
    const j = await r.json();
    const payments = j.data || [];

    // Summary
    const total = payments.filter(p => p.status === 'success').reduce((s, p) => s + (p.amount || 0), 0);
    const successCount = payments.filter(p => p.status === 'success').length;
    const latestPlan = payments.find(p => p.status === 'success')?.plan || '—';
    document.getElementById('sumTotal').textContent = formatRp(total);
    document.getElementById('sumSuccess').textContent = successCount;
    document.getElementById('sumPlan').textContent = latestPlan;

    if (!payments.length) {
      list.innerHTML = `<div class="flex flex-col items-center gap-3 py-16 text-center">
        <svg class="w-12 h-12 text-slate-300 dark:text-slate-700" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        <div>
          <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Belum ada riwayat pembayaran</p>
          <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">Upgrade ke paket berbayar untuk mulai berlangganan</p>
        </div>
        <a href="pricing.html" class="mt-2 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold transition">Lihat Paket</a>
      </div>`;
      return;
    }

    list.innerHTML = payments.map(p => {
      const st = STATUS[p.status] || STATUS.pending;
      const date = p.created_at ? new Date(p.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
      return `
        <div class="flex items-center gap-4 px-5 py-4 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
          <div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${escHtml(p.plan || '—')} <span class="text-slate-400 font-normal">· ${escHtml(p.period || '—')}</span></p>
            <p class="text-xs text-slate-400 mt-0.5">${date}</p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-sm font-bold text-slate-800 dark:text-slate-200">${formatRp(p.amount)}</p>
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold border ${st.cls} mt-1">${st.label}</span>
          </div>
        </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div class="flex items-center justify-center py-10 text-rose-400 text-sm gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Gagal memuat: ${escHtml(e.message)}
    </div>`;
  }
}

document.getElementById('refreshBtn').onclick = loadPayments;
loadPayments();
</script>
</body>
</html>
