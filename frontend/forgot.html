<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lupa Password — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    @keyframes pulse-slow { 0%,100%{opacity:.4} 50%{opacity:.7} }
    .pulse-slow { animation: pulse-slow 4s ease-in-out infinite; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e293b inset !important; -webkit-text-fill-color: #f8fafc !important; }
  </style>
</head>
<body class="min-h-screen bg-[#080c14] flex items-center justify-center p-4 overflow-hidden relative">

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-amber-600/15 rounded-full blur-[100px] pulse-slow"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] bg-orange-600/15 rounded-full blur-[100px] pulse-slow" style="animation-delay:2s"></div>
    <div class="absolute inset-0" style="background-image:radial-gradient(circle, rgba(99,102,241,0.06) 1px, transparent 1px);background-size:32px 32px;"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="absolute -inset-1 bg-gradient-to-r from-amber-500/20 via-orange-500/15 to-rose-500/20 rounded-3xl blur-xl opacity-60"></div>

    <div class="relative bg-[#0d1117]/90 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl p-8">
      <!-- Top bar -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl blur-md opacity-60"></div>
            <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
              <img src="assets/logo.png" alt="Logo" class="w-6 h-6 object-contain" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
              <svg style="display:none" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
          </div>
          <div>
            <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 text-lg leading-tight">STT Engine</h1>
            <p class="text-[10px] text-slate-500 font-medium">Speech-to-Text Platform</p>
          </div>
        </div>
        <button onclick="Theme.toggle()" class="theme-toggle-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-white transition">
          <span class="theme-icon text-sm">🌙</span>
        </button>
      </div>

      <!-- Icon + heading -->
      <div class="flex items-center gap-4 mb-7">
        <div class="w-14 h-14 rounded-2xl bg-amber-500/15 border border-amber-500/20 flex items-center justify-center shrink-0">
          <svg class="w-7 h-7 text-amber-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-bold text-white mb-0.5">Lupa Password?</h2>
          <p class="text-sm text-slate-400">Masukkan username untuk mendapatkan token reset.</p>
        </div>
      </div>

      <!-- Info box -->
      <div class="flex items-start gap-3 bg-amber-500/8 border border-amber-500/15 rounded-xl p-3.5 mb-6">
        <svg class="w-4 h-4 text-amber-400 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="text-xs text-amber-300/80">Token reset akan ditampilkan langsung di layar. Salin dan gunakan di halaman reset password.</p>
      </div>

      <!-- Form -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Username</label>
          <div class="relative">
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
            <input id="u" value="admin" type="text" placeholder="Masukkan username Anda"
              class="w-full bg-slate-800/60 border border-slate-700 hover:border-slate-600 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 text-sm outline-none transition" />
          </div>
        </div>

        <button id="btn" class="relative w-full overflow-hidden group bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white font-semibold rounded-xl py-3 shadow-lg shadow-amber-900/30 transition-all active:scale-[.99]">
          <span class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></span>
          <span class="relative flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
            Buat Token Reset
          </span>
        </button>
      </div>

      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <a href="login.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Kembali ke halaman login
        </a>
      </div>
    </div>
  </div>

  <script src="assets/page-transition.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('btn').onclick = async () => {
      const username = document.getElementById('u').value.trim();
      if (!username) return UI.err('Username wajib diisi');
      const btn = document.getElementById('btn');
      btn.disabled = true;
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/forgot', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const j = await r.json();
        Swal.close();
        if (!j.reset_token) {
          UI.err('Username tidak ditemukan. Periksa kembali username Anda.');
          btn.disabled = false;
          return;
        }
        const res = await Swal.fire({
          icon: 'success',
          title: 'Token Berhasil Dibuat',
          html: `<p class="text-sm text-slate-400 mb-3">Salin token berikut, lalu buka halaman reset password:</p>
                 <code class="block bg-slate-800 border border-slate-700 rounded-lg p-3 mt-2 break-all text-xs text-indigo-300 font-mono text-left select-all">${j.reset_token}</code>`,
          confirmButtonText: 'Ke Halaman Reset →',
          confirmButtonColor: '#6366f1',
          background: '#0d1117',
          color: '#f8fafc',
        });
        if (res.isConfirmed) PageTransition.go('reset.html?token=' + encodeURIComponent(j.reset_token));
      } catch (e) { Swal.close(); UI.err(e.message); btn.disabled = false; }
    };
  </script>
</body>
</html>
