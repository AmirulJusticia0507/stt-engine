<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lupa Password — STT Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-500 via-orange-600 to-rose-600 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <h1 class="text-2xl font-bold text-gray-800">Lupa Password</h1>
    <p class="text-sm text-gray-500 mb-6">Masukkan username, sistem akan membuat token reset (berlaku 30 menit).</p>
    <label class="block text-sm font-medium text-gray-700">Username</label>
    <input id="u" value="admin" class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 outline-none" />
    <button id="btn" class="mt-6 w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-lg py-2.5 transition">Buat Token Reset</button>
    <div class="mt-4 text-sm"><a href="login.html" class="text-orange-700 hover:underline">← Kembali ke login</a></div>
  </div>
  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('btn').onclick = async () => {
      const username = document.getElementById('u').value.trim();
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/forgot', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const j = await r.json();
        Swal.close();
        if (!j.reset_token) { UI.err('Username tidak ditemukan (atau cek server).'); return; }
        const res = await Swal.fire({
          icon: 'success', title: 'Token dibuat',
          html: `<p class="text-sm">Salin token ini lalu buka halaman reset:</p><code class="block bg-gray-100 rounded p-2 mt-2 break-all text-xs">${j.reset_token}</code>`,
          confirmButtonText: 'Ke Halaman Reset',
        });
        if (res.isConfirmed) location.href = 'reset.html?token=' + encodeURIComponent(j.reset_token);
      } catch (e) { Swal.close(); UI.err(e.message); }
    };
  </script>
</body>
</html>
