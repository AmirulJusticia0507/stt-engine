<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lupa Password — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-amber-500 via-orange-600 to-rose-600 dark:from-slate-950 dark:via-orange-950 dark:to-slate-900 flex items-center justify-center p-4 transition-colors duration-200">
  <div class="bg-white dark:bg-slate-900 dark:border dark:border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-8 relative transition-colors">
    <div class="flex justify-between items-start mb-6">
      <div class="flex items-center gap-3">
        <img src="assets/logo.png" alt="Logo" class="w-12 h-12 rounded-xl object-cover shadow-md border border-white/20" />
        <div>
          <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Lupa Password</h1>
          <p class="text-xs text-gray-500 dark:text-slate-400">Masukkan username untuk membuat token reset.</p>
        </div>
      </div>
      <button id="themeToggleBtn" onclick="Theme.toggle()" class="theme-toggle-btn p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition" title="Ganti Mode">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
    <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Username</label>
    <input id="u" value="admin" class="mt-1 w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-500 outline-none" />
    <button id="btn" class="mt-6 w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-lg py-2.5 shadow-md transition">Buat Token Reset</button>
    <div class="mt-4 text-sm"><a href="login.html" class="text-orange-700 dark:text-orange-400 hover:underline">← Kembali ke login</a></div>
  </div>
  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('btn').onclick = async () => {
      const username = document.getElementById('u').value.trim();
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/forgot', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username }),
        });
        const j = await r.json();
        Swal.close();
        if (!j.reset_token) { UI.err('Username tidak ditemukan (atau cek server).'); return; }
        const res = await Swal.fire({
          icon: 'success', title: 'Token dibuat',
          html: `<p class="text-sm">Salin token ini lalu buka halaman reset:</p><code class="block bg-slate-100 dark:bg-slate-800 rounded p-2 mt-2 break-all text-xs text-slate-800 dark:text-slate-200">${j.reset_token}</code>`,
          confirmButtonText: 'Ke Halaman Reset',
        });
        if (res.isConfirmed) location.href = 'reset.html?token=' + encodeURIComponent(j.reset_token);
      } catch (e) { Swal.close(); UI.err(e.message); }
    };
  </script>
</body>
</html>
