<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riwayat — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-container"></div>

    <main class="flex-1 overflow-y-auto p-5 md:p-7">
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Riwayat Transkripsi</h2>
            <p class="text-xs text-slate-400 mt-0.5">Dari server + localStorage sesi ini</p>
          </div>
          <div class="flex-1"></div>
          <!-- Search -->
          <div class="relative hidden sm:block">
            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input id="searchInput" type="text" placeholder="Cari teks..." class="pl-8 pr-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 w-44 transition" />
          </div>
          <button id="histBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Muat ulang
          </button>
        </div>

        <!-- Table -->
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100 dark:border-slate-800">
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-5 py-3">Waktu</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Sumber</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Bahasa</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Teks</th>
                <th class="text-right text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-5 py-3">Ekspor</th>
              </tr>
            </thead>
            <tbody id="histBody"></tbody>
          </table>
        </div>

        <!-- Pagination info -->
        <div class="px-5 py-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <p class="text-xs text-slate-400" id="histCount">-</p>
          <a href="transcribe.html" class="text-xs text-indigo-500 hover:text-indigo-400 font-medium transition">+ Transkripsi baru</a>
        </div>
      </div>
    </main>

    <footer class="px-7 py-4 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>STT Engine · FastAPI + Faster-Whisper</span>
      <span id="footUser"></span>
    </footer>
  </div>
</div>

<script src="assets/page-transition.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');

Layout.init({ page: 'history', title: 'Riwayat Transkripsi' });
document.getElementById('footUser').textContent = Auth.user;

let localHist = JSON.parse(localStorage.getItem('stt_history') || '[]');
let allRows = [];

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderRows(rows) {
  const body = document.getElementById('histBody');
  document.getElementById('histCount').textContent = rows.length + ' entri';
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" class="px-5 py-12 text-center text-slate-400 dark:text-slate-500">
      <div class="flex flex-col items-center gap-2">
        <svg class="w-10 h-10 opacity-30" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="text-sm font-medium">Belum ada riwayat</p>
        <p class="text-xs">Mulai transkripsi pertama Anda</p>
      </div>
    </td></tr>`;
    return;
  }
  const btnBase = 'inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold transition border';
  body.innerHTML = rows.map(h => `
    <tr class="border-t border-slate-100 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
      <td class="px-5 py-3.5 text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap">${escHtml(h.at)}</td>
      <td class="px-3 py-3.5 text-xs font-medium text-slate-800 dark:text-slate-200 max-w-[120px] truncate" title="${escHtml(h.source)}">${escHtml(h.source)}</td>
      <td class="px-3 py-3.5"><span class="inline-block px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 text-[10px] font-semibold uppercase">${escHtml(h.lang || '—')}</span></td>
      <td class="px-3 py-3.5 text-xs text-slate-600 dark:text-slate-300 max-w-[280px]"><p class="line-clamp-2">${escHtml((h.text || '').slice(0, 150))}</p></td>
      <td class="px-5 py-3.5 text-right whitespace-nowrap">
        ${h.id
          ? `<button class="${btnBase} border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-400 mr-1" onclick="dlHist(${h.id},'txt')">TXT</button>
             <button class="${btnBase} border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-400 mr-1" onclick="dlHist(${h.id},'srt')">SRT</button>
             <button class="${btnBase} border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-400" onclick="dlHist(${h.id},'vtt')">VTT</button>`
          : `<span class="text-[10px] text-slate-400 dark:text-slate-500 italic">lokal</span>`
        }
      </td>
    </tr>
  `).join('');
}

async function loadHistory() {
  document.getElementById('histBody').innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-slate-400 text-xs">
    <div class="flex items-center justify-center gap-2"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Memuat...</div>
  </td></tr>`;
  allRows = [...localHist];
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/history', { headers: Auth.headers() });
    if (r.ok) {
      const j = await r.json();
      if (Array.isArray(j.data)) allRows = [...j.data, ...localHist].slice(0, 100);
    }
  } catch {}
  renderRows(allRows);
}

document.getElementById('histBtn').onclick = loadHistory;
document.getElementById('searchInput')?.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderRows(q ? allRows.filter(h => (h.text || '').toLowerCase().includes(q) || (h.source || '').toLowerCase().includes(q)) : allRows);
});

async function dlHist(id, fmt) {
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/history/${id}/export?format=${fmt}`, { headers: Auth.headers() });
    if (!r.ok) throw new Error('Ekspor gagal');
    const blob = await r.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `transkrip-${id}.${fmt}`; a.click(); URL.revokeObjectURL(a.href);
  } catch (e) { UI.err(e.message); }
}

loadHistory();
</script>
</body>
</html>
