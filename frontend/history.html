<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riwayat — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
<div class="flex min-h-screen">
  <aside id="sidebar" class="bg-slate-900 dark:bg-slate-950 text-slate-200 border-r border-transparent dark:border-slate-800/80 w-64 transition-all duration-200 flex flex-col">
    <div class="flex items-center justify-between px-4 py-4 border-b border-slate-800/60">
      <a href="dashboard.html" id="brand" class="flex items-center gap-2.5 overflow-hidden">
        <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded-xl object-cover shadow-md flex-shrink-0" />
        <span class="lbl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 text-base tracking-tight whitespace-nowrap">STT Engine</span>
      </a>
      <button id="collapseBtn" class="bg-slate-800 hover:bg-slate-700 rounded-lg px-2 py-1 text-xs text-slate-300 transition" title="Collapse">⇔</button>
    </div>
    <nav class="px-2 space-y-1 text-sm">
      <a href="dashboard.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📊 <span class="lbl">Dashboard</span></a>
      <a href="transcribe.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🎤 <span class="lbl">Transcribe</span></a>
      <a href="model.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🧠 <span class="lbl">Model</span></a>
      <a href="audit.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📋 <span class="lbl">Audit Log</span></a>
      <a href="history.html" class="nav block px-3 py-2 rounded-lg bg-slate-800 text-white">🕘 <span class="lbl">Riwayat</span></a>
      <a href="settings.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">⚙️ <span class="lbl">Pengaturan</span></a>
      <a href="users.html" class="nav admin-only block px-3 py-2 rounded-lg hover:bg-slate-800 hidden">👥 <span class="lbl">Manajemen User</span></a>
    </nav>
    <div class="flex-1"></div>
    <div class="p-4 text-xs text-slate-400"><span class="lbl">Login sebagai </span><b id="who" class="text-slate-200"></b></div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200/50 dark:border-slate-800 shadow-sm px-4 py-3 flex items-center gap-3 transition-colors">
      <button id="mobileBtn" class="md:hidden border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg px-2 py-1">☰</button>
      <h1 id="title" class="font-semibold text-slate-800 dark:text-white">Riwayat</h1>
      <div class="flex-1"></div>
      <span id="health" class="text-xs text-slate-500 dark:text-slate-400 hidden md:block"></span>
      <button id="themeToggleBtn" onclick="Theme.toggle()" class="theme-toggle-btn flex items-center gap-1.5 text-xs md:text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 transition cursor-pointer" title="Ganti Mode">
        <span class="theme-icon">🌙</span>
        <span class="theme-text hidden sm:inline">Gelap</span>
      </button>
      <button id="logoutBtn" onclick="Auth.logout()" class="text-sm bg-rose-600 hover:bg-rose-700 text-white rounded-lg px-3 py-1.5">Keluar</button>
    </header>

    <main class="p-4 md:p-6 max-w-5xl w-full mx-auto">
      <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/80 rounded-2xl shadow-sm p-5 transition">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="font-semibold text-slate-900 dark:text-white">Riwayat Transkripsi</h2>
          <div class="flex-1"></div>
          <button id="histBtn" class="text-sm border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg px-3 py-1.5 transition">Muat ulang</button>
        </div>
        <div class="overflow-auto"><table class="w-full text-sm text-slate-800 dark:text-slate-200">
          <thead><tr class="text-left text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800"><th class="py-2">Waktu</th><th>Sumber</th><th>Bhs</th><th>Teks</th><th>Ekspor</th></tr></thead>
          <tbody id="histBody"></tbody>
        </table></div>
      </div>
    </main>

    <footer class="text-center text-xs text-slate-400 dark:text-slate-500 py-4">STT Engine · FastAPI + Faster-Whisper · <span id="footUser"></span></footer>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');
document.getElementById('who').textContent = Auth.user;
document.getElementById('footUser').textContent = Auth.user;
let localHist = JSON.parse(localStorage.getItem('stt_history') || '[]');

const sb = document.getElementById('sidebar');
function setCollapsed(c) {
  sb.classList.toggle('w-64', !c); sb.classList.toggle('w-20', c);
  document.querySelectorAll('#sidebar .lbl').forEach(e => e.style.display = c ? 'none' : '');
  localStorage.setItem('sb_collapsed', c ? '1' : '0');
}
document.getElementById('collapseBtn').onclick = () => setCollapsed(!sb.classList.contains('w-20'));
document.getElementById('mobileBtn').onclick = () => sb.classList.toggle('hidden');
if (localStorage.getItem('sb_collapsed') === '1') setCollapsed(true);

fetch(Auth.apiBase + '/health').then(r => r.json()).then(j => {
  document.getElementById('health').textContent = (j.model || '-') + ' · ' + (j.device || '-');
}).catch(() => document.getElementById('health').textContent = 'backend unreachable');

async function loadHistory() {
  const body = document.getElementById('histBody');
  let rows = [...localHist];
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/history', { headers: Auth.headers() });
    if (r.ok) { const j = await r.json(); if (Array.isArray(j.data)) rows = [...j.data, ...localHist].slice(0, 50); }
  } catch {}
  const btnClass = "text-xs border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded px-1.5 py-0.5 transition";
  body.innerHTML = rows.map(h => `<tr class="border-t border-slate-200 dark:border-slate-800/80"><td class="py-2 text-slate-600 dark:text-slate-400 whitespace-nowrap">${h.at || ''}</td><td class="font-medium text-slate-800 dark:text-slate-200">${h.source || ''}</td><td><span class="inline-block bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-xs">${h.lang || ''}</span></td><td class="text-slate-600 dark:text-slate-300">${(h.text || '').slice(0, 120)}</td><td class="whitespace-nowrap">${h.id ? `<button class="${btnClass}" onclick="dlHist(${h.id},'txt')">TXT</button> <button class="${btnClass}" onclick="dlHist(${h.id},'srt')">SRT</button> <button class="${btnClass}" onclick="dlHist(${h.id},'vtt')">VTT</button>` : '<span class="text-xs text-slate-400 dark:text-slate-500">lokal</span>'}</td></tr>`).join('') || '<tr><td class="py-2 text-slate-400 dark:text-slate-500" colspan="5">Belum ada riwayat.</td></tr>';
}
document.getElementById('histBtn').onclick = loadHistory;

async function dlHist(id, fmt) {
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/history/${id}/export?format=${fmt}`, { headers: Auth.headers() });
    if (!r.ok) throw new Error('Ekspor gagal');
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `transkrip-${id}.${fmt}`;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) { UI.err(e.message); }
}

loadHistory();

async function checkAdminRole() {
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/me', { headers: Auth.headers() });
    if (r.ok) {
      const j = await r.json();
      const isAdmin = j.username === 'admin' || j.role === 'admin';
      document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
    }
  } catch {}
}
checkAdminRole();
</script>
</body>
</html>
