<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STT Engine — Vue 3 + FastAPI</title>
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin: 12px 0; }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid #333; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    pre { white-space: pre-wrap; background: #f6f6f6; padding: 12px; border-radius: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
<div id="app">
  <h1>STT Engine</h1>
  <p>Backend: <code>{{ apiBase }}</code> · <span v-if="health">health: {{ health }}</span></p>

  <div class="card">
    <h3>1) Upload file (REST)</h3>
    <div class="row">
      <input type="file" @change="onFile" accept=".wav,.mp3,.m4a,.ogg,.flac,.webm" />
      <select v-model="lang"><option value="id">id</option><option value="en">en</option></select>
      <button @click="upload" :disabled="!file || loading">{{ loading ? 'Proses...' : 'Transcribe' }}</button>
    </div>
    <pre v-if="restResult">{{ restResult }}</pre>
  </div>

  <div class="card">
    <h3>2) Mic streaming (WebSocket → PCM 16kHz)</h3>
    <div class="row">
      <button @click="startMic" :disabled="streaming">Mulai Mic</button>
      <button @click="stopMic" :disabled="!streaming">Stop</button>
      <span>{{ wsStatus }}</span>
    </div>
    <pre v-if="streamText">{{ streamText }}</pre>
  </div>
</div>

<script>
const { createApp, ref } = Vue;

createApp({
  setup() {
    const apiBase = ref(location.origin);
    const lang = ref('id');
    const file = ref(null);
    const loading = ref(false);
    const restResult = ref('');
    const health = ref('');
    const streaming = ref(false);
    const wsStatus = ref('idle');
    const streamText = ref('');

    let ws = null, audioCtx = null, source = null, proc = null, micStream = null;

    fetch(apiBase.value + '/health').then(r => r.json()).then(j => health.value = JSON.stringify(j)).catch(() => {});

    function onFile(e) { file.value = e.target.files[0] || null; }

    async function upload() {
      if (!file.value) return;
      loading.value = true;
      restResult.value = '';
      const fd = new FormData();
      fd.append('file', file.value);
      try {
        const r = await fetch(`${apiBase.value}/api/v1/transcribe?language=${lang.value}`, { method: 'POST', body: fd });
        restResult.value = JSON.stringify(await r.json(), null, 2);
      } catch (e) { restResult.value = 'Error: ' + e.message; }
      finally { loading.value = false; }
    }

    async function startMic() {
      streamText.value = '';
      ws = new WebSocket(apiBase.value.replace('http', 'ws') + `/ws/v1/transcribe-stream?language=${lang.value}`);
      ws.onopen = () => wsStatus.value = 'ws open';
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.event === 'transcript') streamText.value += (msg.data.text || '') + '\n';
      };
      ws.onerror = () => wsStatus.value = 'ws error';
      ws.onclose = () => wsStatus.value = 'ws closed';

      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      source = audioCtx.createMediaStreamSource(micStream);
      proc = audioCtx.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== 1) return;
        const f32 = e.inputBuffer.getChannelData(0);
        const pcm = new Int16Array(f32.length);
        for (let i = 0; i < f32.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
        ws.send(pcm.buffer);
      };
      source.connect(proc); proc.connect(audioCtx.destination);
      streaming.value = true;
      wsStatus.value = 'mic on';
    }

    function stopMic() {
      streaming.value = false;
      try { proc?.disconnect(); source?.disconnect(); audioCtx?.close(); } catch {}
      micStream?.getTracks().forEach(t => t.stop());
      try { ws?.close(); } catch {}
      wsStatus.value = 'idle';
    }

    return { apiBase, lang, file, loading, restResult, health, streaming, wsStatus, streamText, onFile, upload, startMic, stopMic };
  }
}).mount('#app');
</script>
</body>
</html>
