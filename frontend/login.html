<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes pulse-slow { 0%,100%{opacity:.4} 50%{opacity:.7} }
    .float { animation: float 6s ease-in-out infinite; }
    .pulse-slow { animation: pulse-slow 4s ease-in-out infinite; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e293b inset !important; -webkit-text-fill-color: #f8fafc !important; }
  </style>
</head>
<body class="min-h-screen bg-[#080c14] flex items-center justify-center p-4 overflow-hidden relative">

  <!-- Background blobs -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[100px] pulse-slow"></div>
    <div class="absolute -bottom-40 -right-40 w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[100px] pulse-slow" style="animation-delay:2s"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-pink-600/10 rounded-full blur-[80px] pulse-slow" style="animation-delay:1s"></div>
    <div class="absolute inset-0" style="background-image:radial-gradient(circle, rgba(99,102,241,0.08) 1px, transparent 1px);background-size:32px 32px;"></div>
  </div>

  <!-- Floating decorative elements -->
  <div class="absolute top-20 right-20 w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-purple-500/20 border border-indigo-500/20 backdrop-blur-sm float hidden lg:block" style="animation-delay:1s"></div>
  <div class="absolute bottom-32 left-24 w-10 h-10 rounded-xl bg-gradient-to-br from-pink-500/20 to-rose-500/20 border border-pink-500/20 backdrop-blur-sm float hidden lg:block" style="animation-delay:3s"></div>
  <div class="absolute top-1/3 left-16 w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-500/20 to-blue-500/20 border border-cyan-500/20 backdrop-blur-sm float hidden lg:block" style="animation-delay:2s"></div>

  <!-- Card -->
  <div class="relative w-full max-w-md">
    <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500/30 via-purple-500/20 to-pink-500/30 rounded-3xl blur-xl opacity-60"></div>

    <div class="relative bg-[#0d1117]/90 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl p-8">
      <!-- Top bar -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl blur-md opacity-60"></div>
            <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
              <img src="assets/logo.png" alt="Logo" class="w-6 h-6 object-contain" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
              <svg style="display:none" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4M9 11V7a3 3 0 016 0v4"/></svg>
            </div>
          </div>
          <div>
            <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 text-lg leading-tight">STT Engine</h1>
            <p class="text-[10px] text-slate-500 font-medium">Speech-to-Text Platform</p>
          </div>
        </div>
        <button onclick="Theme.toggle()" class="theme-toggle-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-white transition" title="Toggle theme">
          <span class="theme-icon text-sm">🌙</span>
        </button>
      </div>

      <!-- Heading -->
      <div class="mb-7">
        <h2 class="text-2xl font-bold text-white mb-1">Selamat Datang 👋</h2>
        <p class="text-sm text-slate-400">Masuk ke dashboard untuk mulai transkripsi.</p>
      </div>

      <!-- Form -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Username</label>
          <div class="relative">
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
            <input id="u" value="admin" type="text" placeholder="Masukkan username"
              class="w-full bg-slate-800/60 border border-slate-700 hover:border-slate-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 text-sm outline-none transition" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <input id="p" value="admin" type="password" placeholder="Masukkan password"
              class="w-full bg-slate-800/60 border border-slate-700 hover:border-slate-600 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 text-sm outline-none transition" />
          </div>
        </div>

        <button id="btn" class="relative w-full overflow-hidden group bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl py-3 shadow-lg shadow-indigo-900/40 transition-all active:scale-[.99] mt-2">
          <span class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></span>
          <span class="relative flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Masuk ke Dashboard
          </span>
        </button>
      </div>

      <!-- Footer links -->
      <div class="flex items-center justify-between mt-6 pt-5 border-t border-slate-800">
        <a href="forgot.html" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium transition">Lupa password?</a>
        <a href="register.html" class="text-xs text-slate-400 hover:text-white transition">Belum punya akun? <span class="text-indigo-400 font-medium">Daftar</span></a>
      </div>

      <!-- Company profile link -->
      <div class="mt-4">
        <a href="docs/company-profile.html" target="_blank"
          class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl border border-slate-700 hover:border-slate-600 bg-slate-800/40 hover:bg-slate-800/70 text-slate-400 hover:text-white text-xs font-medium transition">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          Lihat Company Profile &amp; Legalitas
          <svg class="w-3 h-3 ml-auto text-slate-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script src="assets/auth.js"></script>
  <script>
    if (Auth.token) location.replace('dashboard.html');
    async function doLogin() {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      if (!username || !password) return UI.err('Username dan password wajib diisi');
      const btn = document.getElementById('btn');
      btn.disabled = true;
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!r.ok) throw new Error((await r.json()).detail || 'Login gagal');
        const j = await r.json();
        Auth.token = j.access_token; Auth.user = username;
        Swal.close(); UI.ok('Selamat datang, ' + username);
        setTimeout(() => location.href = 'dashboard.html', 800);
      } catch (e) { Swal.close(); UI.err(e.message); btn.disabled = false; }
    }
    document.getElementById('btn').onclick = doLogin;
    document.getElementById('p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
