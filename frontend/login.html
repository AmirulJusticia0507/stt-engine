<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk — STT Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <h1 class="text-2xl font-bold text-gray-800">STT Engine</h1>
    <p class="text-sm text-gray-500 mb-6">Masuk untuk lanjut ke dashboard</p>
    <label class="block text-sm font-medium text-gray-700">Username</label>
    <input id="u" value="admin" class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" />
    <label class="block text-sm font-medium text-gray-700 mt-4">Password</label>
    <input id="p" value="admin" type="password" class="mt-1 w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none" />
    <button id="btn" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2.5 transition">Masuk</button>
    <div class="flex justify-between mt-4 text-sm">
      <a href="forgot.html" class="text-indigo-600 hover:underline">Lupa password?</a>
      <span class="text-gray-400">admin / admin</span>
    </div>
  </div>
  <script src="assets/auth.js"></script>
  <script>
    if (Auth.token) location.replace('dashboard.html');
    async function doLogin() {
      const username = document.getElementById('u').value.trim();
      const password = document.getElementById('p').value;
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!r.ok) throw new Error((await r.json()).detail || 'Login gagal');
        const j = await r.json();
        Auth.token = j.access_token; Auth.user = username;
        Swal.close(); UI.ok('Selamat datang, ' + username);
        setTimeout(() => location.href = 'dashboard.html', 800);
      } catch (e) { Swal.close(); UI.err(e.message); }
    }
    document.getElementById('btn').onclick = doLogin;
    document.getElementById('p').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
