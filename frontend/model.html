<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model & Perangkat — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
<div class="flex min-h-screen">
  <aside id="sidebar" class="bg-slate-900 dark:bg-slate-950 text-slate-200 border-r border-transparent dark:border-slate-800/80 w-64 transition-all duration-200 flex flex-col">
    <div class="flex items-center justify-between px-4 py-4 border-b border-slate-800/60">
      <a href="dashboard.html" id="brand" class="flex items-center gap-2.5 overflow-hidden">
        <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded-xl object-cover shadow-md flex-shrink-0" />
        <span class="lbl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 text-base tracking-tight whitespace-nowrap">STT Engine</span>
      </a>
      <button id="collapseBtn" class="bg-slate-800 hover:bg-slate-700 rounded-lg px-2 py-1 text-xs text-slate-300 transition" title="Collapse">⇔</button>
    </div>
    <nav class="px-2 space-y-1 text-sm">
      <a href="dashboard.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📊 <span class="lbl">Dashboard</span></a>
      <a href="transcribe.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🎤 <span class="lbl">Transcribe</span></a>
      <a href="model.html" class="nav block px-3 py-2 rounded-lg bg-slate-800 text-white">🧠 <span class="lbl">Model</span></a>
      <a href="audit.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📋 <span class="lbl">Audit Log</span></a>
      <a href="history.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🕘 <span class="lbl">Riwayat</span></a>
      <a href="settings.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">⚙️ <span class="lbl">Pengaturan</span></a>
      <a href="users.html" class="nav admin-only block px-3 py-2 rounded-lg hover:bg-slate-800 hidden">👥 <span class="lbl">Manajemen User</span></a>
    </nav>
    <div class="flex-1"></div>
    <div class="p-4 text-xs text-slate-400"><span class="lbl">Login sebagai </span><b id="who" class="text-slate-200"></b></div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200/50 dark:border-slate-800 shadow-sm px-4 py-3 flex items-center gap-3 transition-colors">
      <button id="mobileBtn" class="md:hidden border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg px-2 py-1">☰</button>
      <h1 id="title" class="font-semibold text-slate-800 dark:text-white">Model & Perangkat</h1>
      <div class="flex-1"></div>
      <span id="health" class="text-xs text-slate-500 dark:text-slate-400 hidden md:block"></span>
      <button id="themeToggleBtn" onclick="Theme.toggle()" class="theme-toggle-btn flex items-center gap-1.5 text-xs md:text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 transition cursor-pointer" title="Ganti Mode">
        <span class="theme-icon">🌙</span>
        <span class="theme-text hidden sm:inline">Gelap</span>
      </button>
      <button id="logoutBtn" onclick="Auth.logout()" class="text-sm bg-rose-600 hover:bg-rose-700 text-white rounded-lg px-3 py-1.5">Keluar</button>
    </header>

    <main class="p-4 md:p-6 max-w-5xl w-full mx-auto">
      <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/80 rounded-2xl shadow-sm p-5 transition">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="font-semibold text-slate-900 dark:text-white">Model & Perangkat</h2>
          <div class="flex-1"></div>
          <button id="sysBtn" class="text-sm border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg px-3 py-1.5 transition">Muat ulang</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-50 dark:bg-slate-800/70 border border-slate-200/60 dark:border-slate-700/60 rounded-xl p-4 transition"><div id="mModel" class="text-lg font-bold text-slate-900 dark:text-white">-</div><div class="text-xs text-slate-500 dark:text-slate-400">Model aktif</div></div>
          <div class="bg-slate-50 dark:bg-slate-800/70 border border-slate-200/60 dark:border-slate-700/60 rounded-xl p-4 transition"><div id="mDevice" class="text-lg font-bold text-slate-900 dark:text-white">-</div><div class="text-xs text-slate-500 dark:text-slate-400">Device / Compute</div></div>
          <div class="bg-slate-50 dark:bg-slate-800/70 border border-slate-200/60 dark:border-slate-700/60 rounded-xl p-4 transition"><div id="mVram" class="text-lg font-bold text-slate-900 dark:text-white">-</div><div class="text-xs text-slate-500 dark:text-slate-400">GPU / VRAM</div></div>
        </div>
        <pre id="sysOut" class="bg-slate-50 dark:bg-slate-800/70 text-slate-800 dark:text-slate-200 border border-slate-200/50 dark:border-slate-700/60 rounded-lg p-3 mt-3 text-xs overflow-auto">Memuat…</pre>
        <div class="flex flex-col sm:flex-row gap-2 items-center mt-3">
          <select id="modelSel" class="w-full sm:w-auto border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-lg px-2 py-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="tiny">tiny (CPU)</option>
            <option value="base">base</option>
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large-v3">large-v3</option>
            <option value="large-v3-turbo">large-v3-turbo (GPU)</option>
          </select>
          <button id="modelBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg px-4 py-2 shadow-sm transition">Ganti Model</button>
          <span class="text-xs text-slate-500 dark:text-slate-400">Model baru di-load saat transcribe berikutnya.</span>
        </div>
      </div>
    </main>

    <footer class="text-center text-xs text-slate-400 dark:text-slate-500 py-4">STT Engine · FastAPI + Faster-Whisper · <span id="footUser"></span></footer>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');
document.getElementById('who').textContent = Auth.user;
document.getElementById('footUser').textContent = Auth.user;

// sidebar collapse
const sb = document.getElementById('sidebar');
function setCollapsed(c) {
  sb.classList.toggle('w-64', !c); sb.classList.toggle('w-20', c);
  document.querySelectorAll('#sidebar .lbl').forEach(e => e.style.display = c ? 'none' : '');
  localStorage.setItem('sb_collapsed', c ? '1' : '0');
}
document.getElementById('collapseBtn').onclick = () => setCollapsed(!sb.classList.contains('w-20'));
document.getElementById('mobileBtn').onclick = () => sb.classList.toggle('hidden');
if (localStorage.getItem('sb_collapsed') === '1') setCollapsed(true);

fetch(Auth.apiBase + '/health').then(r => r.json()).then(j => {
  document.getElementById('health').textContent = (j.model || '-') + ' · ' + (j.device || '-');
  document.getElementById('mModel').textContent = (j.model || '-') + (j.loaded ? ' ●' : '');
  document.getElementById('mDevice').textContent = (j.device || '-') + ' / ' + (j.compute_type || '-');
  document.getElementById('mVram').textContent = j.gpu_name ? `${j.gpu_name} (${j.vram_free_mb}/${j.vram_total_mb} MB free)` : (j.cuda_available ? 'cuda' : 'CPU-only');
  document.getElementById('modelSel').value = j.model || 'tiny';
}).catch(() => document.getElementById('health').textContent = 'backend unreachable');

document.getElementById('sysBtn').onclick = () => {
  fetch(Auth.apiBase + '/api/v1/system', { headers: Auth.headers() })
    .then(r => r.json()).then(j => {
      const d = j.data || {};
      document.getElementById('sysOut').textContent = JSON.stringify(d, null, 2);
      document.getElementById('mModel').textContent = (d.model || '-') + (d.loaded ? ' ●' : '');
      document.getElementById('mDevice').textContent = (d.device || '-') + ' / ' + (d.compute_type || '-');
      document.getElementById('mVram').textContent = d.gpu_name ? `${d.gpu_name} (${d.vram_free_mb}/${d.vram_total_mb} MB free)` : (d.cuda_available ? 'cuda' : 'CPU-only');
    }).catch(e => document.getElementById('sysOut').textContent = 'Gagal: ' + e.message);
};

document.getElementById('modelBtn').onclick = async () => {
  const m = document.getElementById('modelSel').value;
  if (!await UI.confirm(`Ganti model ke ${m}? Model baru diunduh & di-load saat transcribe berikutnya.`)) return;
  Swal.showLoading();
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/system/model', {
      method: 'POST', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ model: m }),
    });
    const j = await r.json(); Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Gagal');
    UI.ok('Model diganti ke ' + j.data.model);
    document.getElementById('sysBtn').click();
  } catch (e) { Swal.close(); UI.err(e.message); }
};

async function checkAdminRole() {
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/me', { headers: Auth.headers() });
    if (r.ok) {
      const j = await r.json();
      const isAdmin = j.username === 'admin' || j.role === 'admin';
      document.querySelectorAll('.admin-only').forEach(el => el.classList.toggle('hidden', !isAdmin));
    }
  } catch {}
}
checkAdminRole();
</script>
</body>
</html>
