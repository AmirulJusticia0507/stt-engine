<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model & Perangkat — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
    pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-container"></div>

    <main class="flex-1 overflow-y-auto p-5 md:p-7 space-y-5">

      <!-- Info cards row -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-5">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-500/10 flex items-center justify-center">
              <svg class="w-4.5 h-4.5 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2h-2"/></svg>
            </div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Model Aktif</p>
          </div>
          <p class="text-xl font-bold text-slate-900 dark:text-white" id="mModel">—</p>
          <div class="mt-2 flex items-center gap-1.5">
            <span id="mLoadedDot" class="w-1.5 h-1.5 rounded-full bg-slate-600"></span>
            <span id="mLoadedLabel" class="text-xs text-slate-400">Memuat...</span>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-5">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 flex items-center justify-center">
              <svg class="w-4.5 h-4.5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/></svg>
            </div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Device / Compute</p>
          </div>
          <p class="text-xl font-bold text-slate-900 dark:text-white" id="mDevice">—</p>
          <p class="text-xs text-slate-400 mt-2" id="mCompute">—</p>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-5">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-9 h-9 rounded-xl bg-violet-500/10 flex items-center justify-center">
              <svg class="w-4.5 h-4.5 text-violet-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 9h.01M15 9h.01M9 15h.01M15 15h.01"/></svg>
            </div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">GPU / VRAM</p>
          </div>
          <p class="text-xl font-bold text-slate-900 dark:text-white truncate" id="mVram">—</p>
          <p class="text-xs text-slate-400 mt-2" id="mCuda">—</p>
        </div>
      </div>

      <!-- Model switcher -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Ganti Model</h2>
            <p class="text-xs text-slate-400 mt-0.5">Model baru di-load saat transkripsi berikutnya</p>
          </div>
          <button id="sysBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh
          </button>
        </div>
        <div class="p-5 space-y-5">
          <!-- Model selection grid -->
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="modelGrid">
            <!-- filled by JS -->
          </div>

          <div class="flex items-center gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
            <select id="modelSel" class="flex-1 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition">
              <option value="tiny">tiny — CPU friendly</option>
              <option value="base">base</option>
              <option value="small">small</option>
              <option value="medium">medium</option>
              <option value="large-v3">large-v3</option>
              <option value="large-v3-turbo">large-v3-turbo — GPU recommended</option>
            </select>
            <button id="modelBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl px-5 py-2.5 shadow-md shadow-indigo-900/30 transition whitespace-nowrap">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
              Ganti Model
            </button>
          </div>
        </div>
      </div>

      <!-- Raw system info -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <h3 class="font-semibold text-slate-900 dark:text-white text-sm">Info Sistem Lengkap</h3>
          <button id="copyRaw" class="flex items-center gap-1.5 text-xs text-indigo-400 hover:text-indigo-300 transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            Salin JSON
          </button>
        </div>
        <div class="p-5">
          <pre id="sysOut" class="bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 rounded-xl p-4 text-xs text-slate-700 dark:text-slate-300 overflow-auto max-h-64">Klik Refresh untuk memuat...</pre>
        </div>
      </div>

    </main>
    <footer class="px-7 py-4 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>STT Engine · FastAPI + Faster-Whisper</span>
      <span id="footUser"></span>
    </footer>
  </div>
</div>

<script src="assets/page-transition.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');

Layout.init({ page: 'model', title: 'Model & Perangkat' });
document.getElementById('footUser').textContent = Auth.user;

const MODELS = [
  { value: 'tiny',            label: 'tiny',            badge: 'CPU',  desc: '~75MB · fastest',        color: 'emerald' },
  { value: 'base',            label: 'base',            badge: 'CPU',  desc: '~145MB · fast',          color: 'emerald' },
  { value: 'small',           label: 'small',           badge: 'CPU',  desc: '~465MB · balanced',      color: 'amber'   },
  { value: 'medium',          label: 'medium',          badge: 'GPU',  desc: '~1.5GB · accurate',      color: 'orange'  },
  { value: 'large-v3',        label: 'large-v3',        badge: 'GPU',  desc: '~2.9GB · high accuracy', color: 'rose'    },
  { value: 'large-v3-turbo',  label: 'large-v3-turbo',  badge: 'GPU+', desc: '~1.6GB · best quality',  color: 'violet'  },
];

let currentModel = '';

function renderModelGrid() {
  const colorMap = {
    emerald: 'border-emerald-500/30 bg-emerald-500/8 text-emerald-400',
    amber:   'border-amber-500/30 bg-amber-500/8 text-amber-400',
    orange:  'border-orange-500/30 bg-orange-500/8 text-orange-400',
    rose:    'border-rose-500/30 bg-rose-500/8 text-rose-400',
    violet:  'border-violet-500/30 bg-violet-500/8 text-violet-400',
  };
  document.getElementById('modelGrid').innerHTML = MODELS.map(m => {
    const isActive = m.value === currentModel;
    return `
      <button onclick="selectModel('${m.value}')"
        class="text-left p-3.5 rounded-xl border transition-all ${isActive
          ? 'border-indigo-500 bg-indigo-500/10 ring-2 ring-indigo-500/20'
          : 'border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 hover:border-slate-300 dark:hover:border-slate-600'}">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-sm font-semibold ${isActive ? 'text-indigo-400' : 'text-slate-800 dark:text-slate-200'}">${m.label}</span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${colorMap[m.color]}">${m.badge}</span>
        </div>
        <p class="text-[11px] text-slate-400">${m.desc}</p>
        ${isActive ? '<p class="text-[10px] font-semibold text-indigo-400 mt-1.5">● Aktif</p>' : ''}
      </button>`;
  }).join('');
}

function selectModel(val) {
  document.getElementById('modelSel').value = val;
}

fetch(Auth.apiBase + '/health').then(r => r.json()).then(j => {
  currentModel = j.model || '';
  document.getElementById('pageSubtitle').textContent = (j.model || '-') + ' · ' + (j.device || '-');
  document.getElementById('pageSubtitle').dataset.overridden = '1';
  document.getElementById('mModel').textContent = j.model || '—';
  document.getElementById('mDevice').textContent = j.device || '—';
  document.getElementById('mCompute').textContent = 'Compute: ' + (j.compute_type || '—');
  document.getElementById('mVram').textContent = j.gpu_name || (j.cuda_available ? 'CUDA available' : 'CPU only');
  document.getElementById('mCuda').textContent = j.vram_total_mb ? `VRAM: ${j.vram_free_mb}/${j.vram_total_mb} MB free` : '';
  const dot = document.getElementById('mLoadedDot');
  const lbl = document.getElementById('mLoadedLabel');
  if (j.loaded) { dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500'; lbl.textContent = 'Model loaded'; lbl.className = 'text-xs text-emerald-400'; }
  else { dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500'; lbl.textContent = 'Not loaded yet'; lbl.className = 'text-xs text-amber-400'; }
  document.getElementById('modelSel').value = j.model || 'tiny';
  renderModelGrid();
}).catch(() => { document.getElementById('pageSubtitle').textContent = 'backend unreachable'; renderModelGrid(); });

document.getElementById('sysBtn').onclick = () => {
  fetch(Auth.apiBase + '/api/v1/system', { headers: Auth.headers() })
    .then(r => r.json()).then(j => {
      const d = j.data || j;
      document.getElementById('sysOut').textContent = JSON.stringify(d, null, 2);
      currentModel = d.model || currentModel;
      document.getElementById('mModel').textContent = d.model || '—';
      document.getElementById('mDevice').textContent = d.device || '—';
      document.getElementById('mCompute').textContent = 'Compute: ' + (d.compute_type || '—');
      document.getElementById('mVram').textContent = d.gpu_name || (d.cuda_available ? 'CUDA available' : 'CPU only');
      document.getElementById('mCuda').textContent = d.vram_total_mb ? `VRAM: ${d.vram_free_mb}/${d.vram_total_mb} MB free` : '';
      document.getElementById('modelSel').value = d.model || 'tiny';
      renderModelGrid();
    }).catch(e => document.getElementById('sysOut').textContent = 'Gagal: ' + e.message);
};

document.getElementById('modelBtn').onclick = async () => {
  const m = document.getElementById('modelSel').value;
  if (!await UI.confirm(`Ganti model ke "${m}"? Akan di-load saat transkripsi berikutnya.`)) return;
  Swal.showLoading();
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/system/model', {
      method: 'POST', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ model: m }),
    });
    const j = await r.json(); Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Gagal');
    currentModel = j.data?.model || m;
    renderModelGrid();
    UI.ok('Model diganti ke ' + currentModel);
    document.getElementById('sysBtn').click();
  } catch (e) { Swal.close(); UI.err(e.message); }
};

document.getElementById('copyRaw').onclick = () => {
  const txt = document.getElementById('sysOut').textContent;
  navigator.clipboard.writeText(txt).then(() => UI.ok('JSON disalin!'));
};

renderModelGrid();
</script>
</body>
</html>
