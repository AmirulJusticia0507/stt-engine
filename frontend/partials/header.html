<header id="appHeader" class="sticky top-0 z-10 bg-white/80 dark:bg-[#0d1117]/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800/60 px-5 py-3.5 flex items-center gap-3">

  <!-- Mobile menu toggle -->
  <button id="mobileBtn" class="md:hidden flex items-center justify-center w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" aria-label="Toggle sidebar">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <!-- Page title + subtitle -->
  <div class="flex flex-col min-w-0">
    <h1 class="font-semibold text-slate-800 dark:text-white text-sm leading-tight" id="pageTitle">—</h1>
    <p class="text-[11px] text-slate-400 dark:text-slate-500 hidden sm:block" id="pageSubtitle"></p>
  </div>

  <div class="flex-1"></div>

  <!-- Theme toggle -->
  <button onclick="Theme.toggle()" class="theme-toggle-btn flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition" aria-label="Toggle theme">
    <span class="theme-icon">🌙</span>
    <span class="theme-text hidden sm:inline">Gelap</span>
  </button>

  <!-- Logout -->
  <button onclick="Auth.logout()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-500 text-xs font-medium transition" aria-label="Keluar">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    <span class="hidden sm:inline">Keluar</span>
  </button>

</header>
