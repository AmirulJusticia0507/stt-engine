<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password — STT Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-500 via-teal-600 to-cyan-700 dark:from-slate-950 dark:via-teal-950 dark:to-slate-900 flex items-center justify-center p-4 transition-colors duration-200">
  <div class="bg-white dark:bg-slate-900 dark:border dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-md p-8 relative transition-colors">
    <div class="flex justify-between items-center mb-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Reset Password</h1>
        <p class="text-sm text-gray-500 dark:text-slate-400">Tempel token dari halaman lupa password, lalu isi password baru.</p>
      </div>
      <button id="themeToggleBtn" onclick="Theme.toggle()" class="theme-toggle-btn p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 transition" title="Ganti Mode">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
    <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Token reset</label>
    <textarea id="t" rows="2" class="mt-1 w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
    <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mt-4">Password baru (min 4)</label>
    <input id="p" type="password" class="mt-1 w-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none" />
    <button id="btn" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg py-2.5 shadow-md transition">Simpan Password</button>
    <div class="mt-4 text-sm"><a href="login.html" class="text-emerald-700 dark:text-emerald-400 hover:underline">← Kembali ke login</a></div>
  </div>
  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('t').value = new URLSearchParams(location.search).get('token') || '';
    document.getElementById('btn').onclick = async () => {
      const token = document.getElementById('t').value.trim();
      const np = document.getElementById('p').value;
      if (!token) return UI.err('Token wajib diisi');
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/reset', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: np }),
        });
        const j = await r.json();
        Swal.close();
        if (!r.ok) throw new Error(j.detail || 'Reset gagal');
        UI.ok('Password ' + j.username + ' diperbarui. Silakan login.');
        setTimeout(() => location.href = 'login.html', 1200);
      } catch (e) { Swal.close(); UI.err(e.message); }
    };
  </script>
</body>
</html>
