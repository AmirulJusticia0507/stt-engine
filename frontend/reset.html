<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="bg-slate-900 dark:bg-slate-950 text-slate-200 border-r border-transparent dark:border-slate-800/80 w-64 transition-all duration-200 flex flex-col">
    <div class="flex items-center justify-between px-4 py-4 border-b border-slate-800/60">
      <a href="dashboard.html" id="brand" class="flex items-center gap-2.5 overflow-hidden">
        <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded-xl object-cover shadow-md flex-shrink-0" />
        <span class="lbl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 text-base tracking-tight whitespace-nowrap">STT Engine</span>
      </a>
      <button id="collapseBtn" class="bg-slate-800 hover:bg-slate-700 rounded-lg px-2 py-1 text-xs text-slate-300 transition" title="Collapse">⇔</button>
    </div>
    <nav class="px-2 space-y-1 text-sm">
      <a href="dashboard.html" class="nav block px-3 py-2 rounded-lg bg-slate-800 text-white">📊 <span class="lbl">Dashboard</span></a>
      <a href="transcribe.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🎤 <span class="lbl">Transcribe</span></a>
      <a href="model.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🧠 <span class="lbl">Model</span></a>
      <a href="audit.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📋 <span class="lbl">Audit Log</span></a>
      <a href="history.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🕘 <span class="lbl">Riwayat</span></a>
      <a href="pricing.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800 bg-indigo-600 text-white">💳 <span class="lbl">Langganan</span></a>
      <a href="users.html" class="nav admin-only block px-3 py-2 rounded-lg hover:bg-slate-800 hidden">👥 <span class="lbl">Manajemen User</span></a>
    </nav>
    <div class="flex-1"></div>
    <div class="p-4 text-xs text-slate-400"><span class="lbl">Login sebagai </span><b id="who" class="text-slate-200"></b></div>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- HEADER -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200/50 dark:border-slate-800 shadow-sm px-4 py-3 flex items-center gap-3 transition-colors">
      <button id="mobileBtn" class="md:hidden border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg px-2 py-1">☰</button>
      <h1 id="title" class="font-semibold text-slate-800 dark:text-white">Reset Password</h1>
      <div class="flex-1"></div>
      <span id="health" class="text-xs text-slate-500 dark:text-slate-400 hidden md:block"></span>
      <button id="themeToggleBtn" onclick="Theme.toggle()" class="theme-toggle-btn flex items-center gap-1.5 text-xs md:text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 transition cursor-pointer" title="Ganti Mode">
        <span class="theme-icon">🌙</span>
        <span class="theme-text hidden sm:inline">Gelap</span>
      </button>
      <button id="logoutBtn" onclick="Auth.logout()" class="text-sm bg-rose-600 hover:bg-rose-700 text-white rounded-lg px-3 py-1.5">Keluar</button>
    </header>

    <!-- CONTENT -->
    <main class="p-6 md:p-8 max-w-md w-full mx-auto">
      <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/80 rounded-2xl shadow-sm shadow-indigo-500/10 hover:shadow-md p-6">
        <div class="space-y-6">
          <div>
            <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Reset Password</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400">Tempel token dari langkah sebelumnya.</p>
          </div>

          <form id="resetForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Token Reset</label>
              <textarea id="t" rows="3" placeholder="Tempel token reset Anda di sini..."
                class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-xs font-mono outline-none focus:ring-2 focus:ring-indigo-500/20 text-sm resize-none transition"
                required></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Password Baru</label>
              <div class="relative">
                <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <input id="p" type="password" placeholder="Min. 4 karakter"
                  class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 outline-none transition"
                  required />
              </div>
            </div>

            <!-- Password strength indicator -->
            <div id="strengthWrap" class="mt-3 hidden">
              <div class="flex items-center gap-2">
                <div class="flex-1 h-1 rounded-full bg-slate-700 overflow-hidden">
                  <div id="strengthBar" class="h-full rounded-full transition-all duration-300 w-0"></div>
                </div>
                <span id="strengthLabel" class="text-[10px] font-medium text-slate-400 w-16 text-right"></span>
              </div>
            </div>
          </div>

          <button id="btn" type="submit"
            class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-medium rounded-xl py-3 shadow-lg shadow-emerald-900/30 transition-all active:scale-[.99]"
            required>
            Simpan Password Baru
          </button>
        </div>

        <div class="mt-6 pt-5 border-t border-slate-800 text-center">
          <a href="login.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Kembali ke halaman login
          </a>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
// Pre-fill token from URL
const urlToken = new URLSearchParams(location.search).get('token') || '';
document.getElementById('t').value = urlToken;

// Password strength
const pw = document.getElementById('p');
pw.addEventListener('input', () => {
  const val = pw.value;
  const wrap = document.getElementById('strengthWrap');
  const bar = document.getElementById('strengthBar');
  const lbl = document.getElementById('strengthLabel');
  if (!val) { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  let score = 0;
  if (val.length >= 6) score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    { w: '20%', color: '#ef4444', label: 'Lemah' },
    { w: '40%', color: '#f97316', label: 'Cukup' },
    { w: '60%', color: '#eab308', label: 'Sedang' },
    { w: '80%', color: '#22c55e', label: 'Kuat' },
    { w: '100%', color: '#10b981', label: 'Sangat Kuat' },
  ];
  const lvl = levels[Math.min(score, 4)];
  bar.style.width = lvl.w;
  bar.style.backgroundColor = lvl.color;
  lbl.textContent = lvl.label;
});

// Form submit
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('t').value.trim();
  const np = document.getElementById('p').value;
  if (!token) return UI.err('Token wajib diisi');
  if (!np || np.length < 4) return UI.err('Password minimal 4 karakter');
  const btn = document.getElementById('btn');
  btn.disabled = true;
  Swal.showLoading();
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/auth/reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: np }),
    });
    const j = await r.json();
    Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Reset gagal');
    await UI.ok('Password ' + j.username + ' berhasil diperbarui!');
    location.href = 'login.html';
  } catch (e) { Swal.close(); UI.err(e.message); btn.disabled = false; }
});
</script>
</body>
</html>
