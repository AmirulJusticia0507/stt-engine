<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    @keyframes pulse-slow { 0%,100%{opacity:.4} 50%{opacity:.7} }
    .pulse-slow { animation: pulse-slow 4s ease-in-out infinite; }
    input:-webkit-autofill, textarea:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px #1e293b inset !important; -webkit-text-fill-color: #f8fafc !important; }
  </style>
</head>
<body class="min-h-screen bg-[#080c14] flex items-center justify-center p-4 overflow-hidden relative">

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-[500px] h-[500px] bg-emerald-600/15 rounded-full blur-[100px] pulse-slow"></div>
    <div class="absolute -bottom-40 -left-40 w-[500px] h-[500px] bg-teal-600/15 rounded-full blur-[100px] pulse-slow" style="animation-delay:2s"></div>
    <div class="absolute inset-0" style="background-image:radial-gradient(circle, rgba(16,185,129,0.06) 1px, transparent 1px);background-size:32px 32px;"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="absolute -inset-1 bg-gradient-to-r from-emerald-500/20 via-teal-500/15 to-cyan-500/20 rounded-3xl blur-xl opacity-60"></div>

    <div class="relative bg-[#0d1117]/90 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl p-8">
      <!-- Top bar -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div class="absolute inset-0 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl blur-md opacity-60"></div>
            <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
              <img src="assets/logo.png" alt="Logo" class="w-6 h-6 object-contain" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
              <svg style="display:none" class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
          </div>
          <div>
            <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 text-lg leading-tight">STT Engine</h1>
            <p class="text-[10px] text-slate-500 font-medium">Speech-to-Text Platform</p>
          </div>
        </div>
        <button onclick="Theme.toggle()" class="theme-toggle-btn w-9 h-9 flex items-center justify-center rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 hover:text-white transition">
          <span class="theme-icon text-sm">🌙</span>
        </button>
      </div>

      <!-- Icon + heading -->
      <div class="flex items-center gap-4 mb-7">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/15 border border-emerald-500/20 flex items-center justify-center shrink-0">
          <svg class="w-7 h-7 text-emerald-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-xl font-bold text-white mb-0.5">Reset Password</h2>
          <p class="text-sm text-slate-400">Tempel token dari langkah sebelumnya.</p>
        </div>
      </div>

      <!-- Form -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Token Reset</label>
          <textarea id="t" rows="3" placeholder="Tempel token reset Anda di sini..."
            class="w-full bg-slate-800/60 border border-slate-700 hover:border-slate-600 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-xs font-mono outline-none transition resize-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Password Baru</label>
          <div class="relative">
            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <input id="p" type="password" placeholder="Min. 4 karakter"
              class="w-full bg-slate-800/60 border border-slate-700 hover:border-slate-600 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 text-white placeholder-slate-500 rounded-xl pl-10 pr-4 py-3 text-sm outline-none transition" />
          </div>
        </div>

        <!-- Password strength -->
        <div id="strengthWrap" class="hidden">
          <div class="flex items-center gap-2">
            <div class="flex-1 h-1 rounded-full bg-slate-700 overflow-hidden">
              <div id="strengthBar" class="h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
            <span id="strengthLabel" class="text-[10px] font-medium text-slate-400 w-16 text-right"></span>
          </div>
        </div>

        <button id="btn" class="relative w-full overflow-hidden group bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-xl py-3 shadow-lg shadow-emerald-900/30 transition-all active:scale-[.99]">
          <span class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></span>
          <span class="relative flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Simpan Password Baru
          </span>
        </button>
      </div>

      <div class="mt-6 pt-5 border-t border-slate-800 text-center">
        <a href="login.html" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          Kembali ke halaman login
        </a>
      </div>
    </div>
  </div>

  <script src="assets/auth.js"></script>
  <script>
    document.getElementById('t').value = new URLSearchParams(location.search).get('token') || '';

    const pw = document.getElementById('p');
    pw.addEventListener('input', () => {
      const val = pw.value;
      const wrap = document.getElementById('strengthWrap');
      const bar = document.getElementById('strengthBar');
      const lbl = document.getElementById('strengthLabel');
      if (!val) { wrap.classList.add('hidden'); return; }
      wrap.classList.remove('hidden');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { w: '20%', color: '#ef4444', label: 'Lemah' },
        { w: '40%', color: '#f97316', label: 'Cukup' },
        { w: '60%', color: '#eab308', label: 'Sedang' },
        { w: '80%', color: '#22c55e', label: 'Kuat' },
        { w: '100%', color: '#10b981', label: 'Sangat Kuat' },
      ];
      const lvl = levels[Math.min(score, 4)];
      bar.style.width = lvl.w;
      bar.style.backgroundColor = lvl.color;
      lbl.textContent = lvl.label;
      lbl.style.color = lvl.color;
    });

    document.getElementById('btn').onclick = async () => {
      const token = document.getElementById('t').value.trim();
      const np = document.getElementById('p').value;
      if (!token) return UI.err('Token wajib diisi');
      if (!np || np.length < 4) return UI.err('Password minimal 4 karakter');
      const btn = document.getElementById('btn');
      btn.disabled = true;
      Swal.showLoading();
      try {
        const r = await fetch(Auth.apiBase + '/api/v1/auth/reset', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: np }),
        });
        const j = await r.json();
        Swal.close();
        if (!r.ok) throw new Error(j.detail || 'Reset gagal');
        await UI.ok('Password ' + j.username + ' berhasil diperbarui!');
        location.href = 'login.html';
      } catch (e) { Swal.close(); UI.err(e.message); btn.disabled = false; }
    };
  </script>
</body>
</html>
