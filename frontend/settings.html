<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pengaturan — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-container"></div>

    <main class="flex-1 overflow-y-auto p-5 md:p-7 space-y-5 max-w-2xl">

      <!-- Appearance -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center">
            <svg class="w-4 h-4 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
          </div>
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Tampilan</h2>
            <p class="text-xs text-slate-400 mt-0.5">Pilih mode terang atau gelap</p>
          </div>
        </div>
        <div class="p-5">
          <div class="grid grid-cols-2 gap-3">
            <!-- Light -->
            <button id="btnLight" onclick="setTheme('light')"
              class="relative group flex flex-col items-center gap-3 p-4 rounded-xl border-2 transition-all">
              <div class="w-full h-20 rounded-lg bg-slate-100 border border-slate-200 overflow-hidden flex flex-col">
                <div class="h-4 bg-white border-b border-slate-200 flex items-center px-2 gap-1">
                  <div class="w-2 h-2 rounded-full bg-slate-300"></div>
                  <div class="w-8 h-1.5 rounded bg-slate-200"></div>
                </div>
                <div class="flex flex-1 p-1.5 gap-1.5">
                  <div class="w-8 bg-slate-200 rounded-md"></div>
                  <div class="flex-1 space-y-1">
                    <div class="h-2 bg-slate-200 rounded"></div>
                    <div class="h-2 bg-slate-200 rounded w-3/4"></div>
                    <div class="h-4 bg-indigo-100 rounded mt-1"></div>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Mode Terang</span>
              </div>
              <div id="lightCheck" class="absolute top-3 right-3 w-5 h-5 rounded-full hidden items-center justify-center bg-indigo-600">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              </div>
            </button>

            <!-- Dark -->
            <button id="btnDark" onclick="setTheme('dark')"
              class="relative group flex flex-col items-center gap-3 p-4 rounded-xl border-2 transition-all">
              <div class="w-full h-20 rounded-lg bg-[#0d1117] border border-slate-700 overflow-hidden flex flex-col">
                <div class="h-4 bg-[#161b22] border-b border-slate-700/60 flex items-center px-2 gap-1">
                  <div class="w-2 h-2 rounded-full bg-slate-600"></div>
                  <div class="w-8 h-1.5 rounded bg-slate-700"></div>
                </div>
                <div class="flex flex-1 p-1.5 gap-1.5">
                  <div class="w-8 bg-slate-800 rounded-md"></div>
                  <div class="flex-1 space-y-1">
                    <div class="h-2 bg-slate-700 rounded"></div>
                    <div class="h-2 bg-slate-700 rounded w-3/4"></div>
                    <div class="h-4 bg-indigo-900/60 rounded mt-1"></div>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
                <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">Mode Gelap</span>
              </div>
              <div id="darkCheck" class="absolute top-3 right-3 w-5 h-5 rounded-full hidden items-center justify-center bg-indigo-600">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- API Connection -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-emerald-500/10 flex items-center justify-center">
            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
          </div>
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Koneksi API</h2>
            <p class="text-xs text-slate-400 mt-0.5">URL backend untuk semua request</p>
          </div>
          <div class="ml-auto flex items-center gap-1.5" id="apiStatusBadge">
            <span class="w-1.5 h-1.5 rounded-full bg-slate-500" id="apiStatusDot"></span>
            <span class="text-xs text-slate-400" id="apiStatusText">—</span>
          </div>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5">Base URL API</label>
            <div class="flex gap-2">
              <input id="apiBaseInput" type="text" placeholder="https://your-api-server.com"
                class="flex-1 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl px-3.5 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition" />
              <button id="testApiBtn" class="px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-700 transition whitespace-nowrap">
                Test
              </button>
            </div>
          </div>
          <button id="saveApiBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl px-5 py-2.5 shadow-md shadow-indigo-900/30 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Simpan Pengaturan
          </button>
        </div>
      </div>

      <!-- Account info -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-violet-500/10 flex items-center justify-center">
            <svg class="w-4 h-4 text-violet-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </div>
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Akun</h2>
            <p class="text-xs text-slate-400 mt-0.5">Info sesi login aktif</p>
          </div>
        </div>
        <div class="p-5">
          <div class="flex items-center gap-4 p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200/50 dark:border-slate-700/50">
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-lg font-bold shrink-0" id="accountAvatar">U</div>
            <div class="min-w-0">
              <p class="font-semibold text-slate-900 dark:text-white" id="accountUser"></p>
              <p class="text-xs text-slate-400 mt-0.5">Sesi aktif · <span id="accountApiBase" class="font-mono"></span></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Danger zone -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-rose-200/50 dark:border-rose-900/30 overflow-hidden">
        <div class="px-5 py-4 border-b border-rose-100 dark:border-rose-900/30 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-rose-500/10 flex items-center justify-center">
            <svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <div>
            <h2 class="font-semibold text-rose-600 dark:text-rose-400 text-sm">Zona Berbahaya</h2>
            <p class="text-xs text-slate-400 mt-0.5">Tindakan ini tidak dapat dibatalkan</p>
          </div>
        </div>
        <div class="p-5 space-y-3">
          <div class="flex items-center justify-between gap-4 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700/50 bg-slate-50 dark:bg-slate-800/30">
            <div class="min-w-0">
              <p class="text-sm font-medium text-slate-800 dark:text-slate-200">Hapus Riwayat Lokal</p>
              <p class="text-xs text-slate-400 mt-0.5">Hapus semua data transkripsi dari localStorage</p>
            </div>
            <button id="clearHistBtn" class="shrink-0 w-20 flex items-center justify-center gap-1.5 py-2 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-500 text-xs font-semibold transition">
              Hapus
            </button>
          </div>
        </div>
      </div>

    </main>

    <footer class="px-7 py-4 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>STT Engine · FastAPI + Faster-Whisper</span>
      <span id="footUser"></span>
    </footer>
  </div>
</div>

<script src="assets/page-transition.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');

Layout.init({ page: 'settings', title: 'Pengaturan', subtitle: 'Konfigurasi tampilan dan koneksi API', health: false });
document.getElementById('footUser').textContent = Auth.user;
document.getElementById('accountUser').textContent = Auth.user;
document.getElementById('accountAvatar').textContent = (Auth.user || 'U').charAt(0).toUpperCase();
document.getElementById('accountApiBase').textContent = Auth.apiBase;
document.getElementById('apiBaseInput').value = Auth.apiBase;

// Theme UI
function updateThemeUI() {
  const isDark = Theme.isDark;
  const lightBtn = document.getElementById('btnLight');
  const darkBtn  = document.getElementById('btnDark');
  const lightCheck = document.getElementById('lightCheck');
  const darkCheck  = document.getElementById('darkCheck');
  lightBtn.className = `relative group flex flex-col items-center gap-3 p-4 rounded-xl border-2 transition-all cursor-pointer ${!isDark ? 'border-indigo-500 bg-indigo-500/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}`;
  darkBtn.className  = `relative group flex flex-col items-center gap-3 p-4 rounded-xl border-2 transition-all cursor-pointer ${isDark  ? 'border-indigo-500 bg-indigo-500/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'}`;
  lightCheck.classList.toggle('hidden', isDark);
  lightCheck.classList.toggle('flex', !isDark);
  darkCheck.classList.toggle('hidden', !isDark);
  darkCheck.classList.toggle('flex', isDark);
}

function setTheme(mode) {
  localStorage.setItem(Theme.KEY, mode);
  Theme.apply();
  updateThemeUI();
}

updateThemeUI();

// API test
document.getElementById('testApiBtn').onclick = async () => {
  const url = document.getElementById('apiBaseInput').value.trim();
  const dot = document.getElementById('apiStatusDot');
  const txt = document.getElementById('apiStatusText');
  txt.textContent = 'Testing...';
  dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse';
  try {
    const r = await fetch(url + '/health', { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      const j = await r.json();
      dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
      txt.textContent = 'Online · ' + (j.model || '?');
      txt.className = 'text-xs text-emerald-500';
    } else throw new Error('HTTP ' + r.status);
  } catch (e) {
    dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
    txt.textContent = 'Offline';
    txt.className = 'text-xs text-rose-500';
  }
};

// Save API
document.getElementById('saveApiBtn').onclick = () => {
  const val = document.getElementById('apiBaseInput').value.trim();
  if (val) localStorage.setItem('apiBase', val);
  else localStorage.removeItem('apiBase');
  document.getElementById('accountApiBase').textContent = val || location.origin;
  UI.ok('Pengaturan API disimpan!');
};

// Clear history
document.getElementById('clearHistBtn').onclick = async () => {
  if (!await UI.confirm('Hapus semua riwayat lokal? Data ini tidak dapat dipulihkan.')) return;
  localStorage.removeItem('stt_history');
  UI.ok('Riwayat lokal dihapus');
};

// Initial API status check
document.getElementById('testApiBtn').click();
</script>
</body>
</html>
