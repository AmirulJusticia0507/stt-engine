<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manajemen User — STT Engine</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(.4,0,.2,1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen">
<div class="flex min-h-screen">

  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div id="header-container"></div>

    <main class="flex-1 overflow-y-auto p-5 md:p-7 space-y-5">

      <!-- Stats -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-4">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total User</p>
          <p class="text-2xl font-extrabold text-slate-900 dark:text-white" id="statTotal">—</p>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-4">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Aktif</p>
          <p class="text-2xl font-extrabold text-emerald-500" id="statActive">—</p>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-4">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Paket Free</p>
          <p class="text-2xl font-extrabold text-violet-500" id="statFree">—</p>
        </div>
        <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 p-4">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Berlangganan</p>
          <p class="text-2xl font-extrabold text-indigo-500" id="statPaid">—</p>
        </div>
      </div>

      <!-- User table -->
      <div class="bg-white dark:bg-slate-900/80 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
          <div>
            <h2 class="font-semibold text-slate-900 dark:text-white text-sm">Daftar Pengguna</h2>
            <p class="text-xs text-slate-400 mt-0.5" id="userCount">Memuat...</p>
          </div>
          <div class="flex-1"></div>
          <div class="relative hidden sm:block">
            <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input id="searchUser" type="text" placeholder="Cari username..."
              class="pl-8 pr-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-700 dark:text-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 w-40 transition" />
          </div>
          <button id="userRefreshBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-100 dark:border-slate-800">
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-5 py-3">User</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Role</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Paket</th>
                <th class="text-left text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-3 py-3">Kredit</th>
                <th class="text-right text-[11px] font-semibold text-slate-400 uppercase tracking-wider px-5 py-3">Aksi</th>
              </tr>
            </thead>
            <tbody id="userBody"></tbody>
          </table>
        </div>
      </div>

    </main>

    <footer class="px-7 py-4 border-t border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
      <span>STT Engine · FastAPI + Faster-Whisper</span>
      <span id="footUser"></span>
    </footer>
  </div>
</div>

<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');

Layout.init({ page: 'users', title: 'Manajemen User', subtitle: 'Admin panel — kelola semua pengguna', health: false });
document.getElementById('footUser').textContent = Auth.user;

const username = Auth.user;

function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const PLAN_COLORS = {
  free:  'bg-slate-500/10 text-slate-400 border-slate-500/20',
  basic: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
  pro:   'bg-violet-500/10 text-violet-400 border-violet-500/20',
};

let allUsers = [];

function renderUsers(rows) {
  const body = document.getElementById('userBody');
  document.getElementById('userCount').textContent = rows.length + ' pengguna';
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" class="px-5 py-12 text-center text-slate-400 text-sm">Tidak ada user ditemukan.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(u => {
    const plan = (u.plan || 'free').toLowerCase();
    const planCls = PLAN_COLORS[plan] || PLAN_COLORS.free;
    const isAdmin = u.role === 'admin';
    const isSelf  = u.username === username;
    return `
      <tr class="border-t border-slate-100 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
        <td class="px-5 py-3.5">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold shrink-0">
              ${escHtml((u.username || '?').charAt(0).toUpperCase())}
            </div>
            <span class="text-sm font-semibold text-slate-800 dark:text-slate-200">${escHtml(u.username)}</span>
            ${isSelf ? '<span class="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-1.5 py-0.5 rounded-full font-semibold">Anda</span>' : ''}
          </div>
        </td>
        <td class="px-3 py-3.5">
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold border ${isAdmin ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-slate-500/10 text-slate-400 border-slate-500/20'}">
            ${escHtml(u.role || 'user')}
          </span>
        </td>
        <td class="px-3 py-3.5">
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold border ${planCls}">
            ${escHtml(u.plan || 'free')}
          </span>
        </td>
        <td class="px-3 py-3.5">
          <span class="font-mono text-sm font-semibold text-indigo-500">${escHtml(String(u.credits ?? 0))}</span>
        </td>
        <td class="px-5 py-3.5 text-right">
          ${isSelf
            ? '<span class="text-[11px] text-slate-400 italic">(akun Anda)</span>'
            : `<div class="flex items-center justify-end gap-1.5 flex-wrap">
                <button onclick="changeRole('${escHtml(u.username)}','${isAdmin ? 'user' : 'admin'}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-400 transition whitespace-nowrap">
                  ${isAdmin ? 'Jadi User' : 'Jadi Admin'}
                </button>
                <button onclick="topupCredits('${escHtml(u.username)}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border border-emerald-500/30 bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500/20 transition">
                  +Kredit
                </button>
                <button onclick="setCredits('${escHtml(u.username)}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border border-indigo-500/30 bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500/20 transition">
                  Set
                </button>
                <button onclick="deleteUser('${escHtml(u.username)}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-rose-600 hover:bg-rose-700 text-white transition">
                  Hapus
                </button>
              </div>`
          }
        </td>
      </tr>`;
  }).join('');
}

async function loadUsers() {
  document.getElementById('userBody').innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-slate-400 text-xs">
    <div class="flex items-center justify-center gap-2"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg> Memuat...</div>
  </td></tr>`;
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/users', { headers: Auth.headers() });
    if (!r.ok) throw new Error('Gagal memuat user (butuh akses admin)');
    const j = await r.json();
    allUsers = j.users || [];

    const total  = allUsers.length;
    const active = allUsers.filter(u => u.is_active !== false).length;
    const free   = allUsers.filter(u => !u.plan || u.plan.toLowerCase() === 'free').length;
    const paid   = total - free;
    document.getElementById('statTotal').textContent  = total;
    document.getElementById('statActive').textContent = active;
    document.getElementById('statFree').textContent   = free;
    document.getElementById('statPaid').textContent   = paid;

    renderUsers(allUsers);
  } catch (e) {
    document.getElementById('userBody').innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-rose-400 text-sm">${escHtml(e.message)}</td></tr>`;
    document.getElementById('userCount').textContent = 'Error';
  }
}

document.getElementById('userRefreshBtn').onclick = loadUsers;
document.getElementById('searchUser')?.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderUsers(q ? allUsers.filter(u => (u.username || '').toLowerCase().includes(q)) : allUsers);
});

async function changeRole(uname, newRole) {
  if (!await UI.confirm(`Ubah role "${uname}" menjadi "${newRole}"?`)) return;
  Swal.showLoading();
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users/${uname}/role`, {
      method: 'PATCH', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ role: newRole }),
    });
    const j = await r.json(); Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Gagal');
    UI.ok(`Role ${uname} diubah ke ${newRole}`);
    loadUsers();
  } catch (e) { Swal.close(); UI.err(e.message); }
}

async function topupCredits(uname) {
  const { value } = await Swal.fire({
    title: 'Tambah Kredit',
    input: 'number', inputLabel: `Jumlah kredit untuk "${uname}"`, inputPlaceholder: '100',
    confirmButtonText: 'Tambah', showCancelButton: true, cancelButtonText: 'Batal',
    inputAttributes: { min: 1 },
    background: document.documentElement.classList.contains('dark') ? '#0d1117' : '#fff',
    color: document.documentElement.classList.contains('dark') ? '#f8fafc' : '#0f172a',
  });
  if (!value) return;
  Swal.showLoading();
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users/${uname}/credits/topup`, {
      method: 'POST', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ amount: parseInt(value) }),
    });
    const j = await r.json(); Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Gagal');
    UI.ok(`Kredit ${uname} ditambah ${value}`);
    loadUsers();
  } catch (e) { Swal.close(); UI.err(e.message); }
}

async function setCredits(uname) {
  const { value } = await Swal.fire({
    title: 'Set Kredit',
    input: 'number', inputLabel: `Set kredit "${uname}" ke:`, inputPlaceholder: '0',
    confirmButtonText: 'Simpan', showCancelButton: true, cancelButtonText: 'Batal',
    inputAttributes: { min: 0 },
    background: document.documentElement.classList.contains('dark') ? '#0d1117' : '#fff',
    color: document.documentElement.classList.contains('dark') ? '#f8fafc' : '#0f172a',
  });
  if (value === undefined || value === '') return;
  Swal.showLoading();
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users/${uname}/credits`, {
      method: 'PUT', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ credits: parseInt(value) }),
    });
    const j = await r.json(); Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Gagal');
    UI.ok(`Kredit ${uname} diset ke ${value}`);
    loadUsers();
  } catch (e) { Swal.close(); UI.err(e.message); }
}

async function deleteUser(uname) {
  if (!await UI.confirm(`Hapus user "${uname}" secara permanen? Tindakan ini tidak dapat dibatalkan!`)) return;
  Swal.showLoading();
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users/${uname}`, {
      method: 'DELETE', headers: Auth.headers(),
    });
    Swal.close();
    if (!r.ok) { const j = await r.json(); throw new Error(j.detail || 'Gagal'); }
    UI.ok(`User "${uname}" dihapus`);
    loadUsers();
  } catch (e) { Swal.close(); UI.err(e.message); }
}

loadUsers();
</script>
</body>
</html>
