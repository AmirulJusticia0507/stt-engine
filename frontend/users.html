<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manajemen User — STT Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/theme.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
<div class="flex min-h-screen">
  <aside id="sidebar" class="bg-slate-900 dark:bg-slate-950 text-slate-200 border-r border-transparent dark:border-slate-800/80 w-64 transition-all duration-200 flex flex-col">
    <div class="flex items-center justify-between px-4 py-4">
      <span id="brand" class="font-bold text-lg">🎙️ STT Engine</span>
      <button id="collapseBtn" class="bg-slate-800 rounded-lg px-2 py-1 text-sm" title="Collapse">⇔</button>
    </div>
    <nav class="px-2 space-y-1 text-sm">
      <a href="dashboard.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📊 <span class="lbl">Dashboard</span></a>
      <a href="transcribe.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🎤 <span class="lbl">Transcribe</span></a>
      <a href="model.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🧠 <span class="lbl">Model</span></a>
      <a href="audit.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">📋 <span class="lbl">Audit Log</span></a>
      <a href="history.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">🕘 <span class="lbl">Riwayat</span></a>
      <a href="settings.html" class="nav block px-3 py-2 rounded-lg hover:bg-slate-800">⚙️ <span class="lbl">Pengaturan</span></a>
      <a href="users.html" class="nav admin-only block px-3 py-2 rounded-lg bg-slate-800 text-white">👥 <span class="lbl">Manajemen User</span></a>
    </nav>
    <div class="flex-1"></div>
    <div class="p-4 text-xs text-slate-400"><span class="lbl">Login sebagai </span><b id="who" class="text-slate-200"></b></div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200/50 dark:border-slate-800 shadow-sm px-4 py-3 flex items-center gap-3 transition-colors">
      <button id="mobileBtn" class="md:hidden border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg px-2 py-1">☰</button>
      <h1 id="title" class="font-semibold text-slate-800 dark:text-white">Manajemen User</h1>
      <div class="flex-1"></div>
      <span id="health" class="text-xs text-slate-500 dark:text-slate-400 hidden md:block"></span>
      <button id="themeToggleBtn" onclick="Theme.toggle()" class="theme-toggle-btn flex items-center gap-1.5 text-xs md:text-sm bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 transition cursor-pointer" title="Ganti Mode">
        <span class="theme-icon">🌙</span>
        <span class="theme-text hidden sm:inline">Gelap</span>
      </button>
      <button id="logoutBtn" onclick="Auth.logout()" class="text-sm bg-rose-600 hover:bg-rose-700 text-white rounded-lg px-3 py-1.5">Keluar</button>
    </header>

    <main class="p-4 md:p-6 max-w-5xl w-full mx-auto">
      <div class="bg-white dark:bg-slate-900 border border-slate-200/60 dark:border-slate-800/80 rounded-2xl shadow-sm p-5 transition">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="font-semibold text-slate-900 dark:text-white">Manajemen User</h2>
          <div class="flex-1"></div>
          <button id="userRefreshBtn" class="text-sm border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg px-3 py-1.5 transition">Muat ulang</button>
        </div>
        <div class="mb-4 flex flex-col sm:flex-row gap-2">
          <input id="newUserName" type="text" placeholder="Username baru" class="w-full sm:w-auto border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
          <input id="newUserPass" type="password" placeholder="Password" class="w-full sm:w-auto border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
          <select id="newUserRole" class="w-full sm:w-auto border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white rounded-lg px-3 py-2 text-sm outline-none">
            <option value="user">user</option>
            <option value="admin">admin</option>
          </select>
          <button id="createUserBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg px-4 py-2 shadow-sm transition">Tambah User</button>
        </div>
        <div class="overflow-auto"><table class="w-full text-sm text-slate-800 dark:text-slate-200">
          <thead><tr class="text-left text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800"><th class="py-2">Username</th><th>Role</th><th>Aksi</th></tr></thead>
          <tbody id="userBody"></tbody>
        </table></div>
      </div>
    </main>

    <footer class="text-center text-xs text-slate-400 dark:text-slate-500 py-4">STT Engine · FastAPI + Faster-Whisper · <span id="footUser"></span></footer>
  </div>
</div>

<script src="assets/auth.js"></script>
<script>
if (!Auth.requireAuth()) throw new Error('redirect');
document.getElementById('who').textContent = Auth.user;
document.getElementById('footUser').textContent = Auth.user;

const sb = document.getElementById('sidebar');
function setCollapsed(c) {
  sb.classList.toggle('w-64', !c); sb.classList.toggle('w-20', c);
  document.querySelectorAll('#sidebar .lbl').forEach(e => e.style.display = c ? 'none' : '');
  document.getElementById('brand').textContent = c ? '🎙️' : '🎙️ STT Engine';
  localStorage.setItem('sb_collapsed', c ? '1' : '0');
}
document.getElementById('collapseBtn').onclick = () => setCollapsed(!sb.classList.contains('w-20'));
document.getElementById('mobileBtn').onclick = () => sb.classList.toggle('hidden');
if (localStorage.getItem('sb_collapsed') === '1') setCollapsed(true);

fetch(Auth.apiBase + '/health').then(r => r.json()).then(j => {
  document.getElementById('health').textContent = (j.model || '-') + ' · ' + (j.device || '-');
}).catch(() => document.getElementById('health').textContent = 'backend unreachable');

async function loadUsers() {
  const body = document.getElementById('userBody');
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/users', { headers: Auth.headers() });
    if (!r.ok) throw new Error('Gagal memuat user');
    const j = await r.json();
    const rows = j.users || [];
    const btnClass = "text-xs border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded px-1.5 py-0.5 mr-1 transition";
    body.innerHTML = rows.map(u => `<tr class="border-t border-slate-200 dark:border-slate-800/80"><td class="py-2 font-medium">${u.username}</td><td class="py-2"><span class="px-2 py-0.5 rounded text-xs ${u.role === 'admin' ? 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 font-semibold' : 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300'}">${u.role}</span></td><td class="py-2 whitespace-nowrap">${u.username !== 'admin' ? `<button class="${btnClass}" onclick="changeRole('${u.username}', '${u.role === 'admin' ? 'user' : 'admin'}')">${u.role === 'admin' ? 'Buat User' : 'Jadikan Admin'}</button> <button class="text-xs bg-rose-600 hover:bg-rose-700 text-white rounded px-2 py-1 transition" onclick="deleteUser('${u.username}')">Hapus</button>` : '<span class="text-xs text-slate-400 dark:text-slate-500">(admin utama)</span>'}</td></tr>`).join('') || '<tr><td class="py-2 text-slate-400 dark:text-slate-500" colspan="3">Belum ada user.</td></tr>';
  } catch (e) { body.innerHTML = '<tr><td class="py-2 text-rose-500" colspan="3">Gagal memuat: ' + e.message + '</td></tr>'; }
}
document.getElementById('userRefreshBtn').onclick = loadUsers;

document.getElementById('createUserBtn').onclick = async () => {
  const username = document.getElementById('newUserName').value.trim();
  const password = document.getElementById('newUserPass').value;
  const role = document.getElementById('newUserRole').value;
  if (!username || !password) return UI.err('Username dan password wajib diisi');
  Swal.showLoading();
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users`, {
      method: 'POST', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ username, password, role }),
    });
    const j = await r.json(); Swal.close();
    if (!r.ok) throw new Error(j.detail || 'Gagal membuat user');
    UI.ok('User ' + username + ' dibuat');
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserPass').value = '';
    loadUsers();
  } catch (e) { Swal.close(); UI.err(e.message); }
};

async function changeRole(username, newRole) {
  if (!await UI.confirm(`Ubah role ${username} menjadi ${newRole}?`)) return;
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users/${username}/role`, {
      method: 'PATCH', headers: Auth.headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ role: newRole }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || 'Gagal mengubah role');
    UI.ok('Role ' + username + ' diubah ke ' + newRole);
    loadUsers();
  } catch (e) { UI.err(e.message); }
}

async function deleteUser(username) {
  if (!await UI.confirm(`Hapus user ${username}?`)) return;
  try {
    const r = await fetch(`${Auth.apiBase}/api/v1/users/${username}`, {
      method: 'DELETE', headers: Auth.headers(),
    });
    if (!r.ok) throw new Error((await r.json()).detail || 'Gagal menghapus user');
    UI.ok('User ' + username + ' dihapus');
    loadUsers();
  } catch (e) { UI.err(e.message); }
}

loadUsers();

async function checkAdminRole() {
  try {
    const r = await fetch(Auth.apiBase + '/api/v1/me', { headers: Auth.headers() });
    if (r.ok) {
      const j = await r.json();
      const isAdmin = j.username === 'admin' || j.role === 'admin';
      if (!isAdmin) window.location.href = 'dashboard.html';
    }
  } catch {}
}
checkAdminRole();
</script>
</body>
</html>
